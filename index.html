<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WorkBridge</title>
<style>
:root{--ink:#eceef1;--mut:#9aa1ab;--line:rgba(255,255,255,.12);--acc:#d9dde3;--ok:#7fc6a0;--no:#d98a8a;--r:22px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);background:#0b0c0f;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid rgba(255,255,255,.6);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;background:
 radial-gradient(60vmax 40vmax at 15% 0%,rgba(190,200,215,.16),transparent 60%),
 radial-gradient(50vmax 40vmax at 100% 60%,rgba(140,155,175,.13),transparent 60%),
 linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/48px 48px,
 linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/48px 48px,#0b0c0f}
.lg{background:rgba(255,255,255,.045);
 -webkit-backdrop-filter:blur(4px) saturate(1.4);backdrop-filter:blur(4px) saturate(1.4);
 backdrop-filter:blur(2px) url(#lens) saturate(1.4) brightness(1.06);
 box-shadow:inset 1px 1px 0 -.5px rgba(255,255,255,.55),inset -1px -1px 0 -.5px rgba(255,255,255,.22),inset 0 0 16px rgba(255,255,255,.06),0 12px 32px rgba(0,0,0,.45);overflow:hidden}
.lg::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
 background:radial-gradient(200px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.16),transparent 60%),linear-gradient(135deg,rgba(255,255,255,.1),transparent 35%)}
.tile,.form,.btn,.tt,.box,.search,#fab,.menu a{position:relative}
.lg>*:not(.bm){position:relative}

header{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;max-width:1100px;margin:0 auto;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:9px 12px 9px 16px;border-radius:999px}
header .hin{position:static;display:contents}
.logo{font-weight:700;letter-spacing:-.01em;display:flex;gap:9px;align-items:center}
.logo b{width:24px;height:24px;border-radius:7px;background:var(--acc);color:#111;display:grid;place-items:center;font-size:.72rem}
.who{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font-size:.76rem;font-weight:500;padding:6px 13px;border-radius:99px;cursor:pointer}
main{position:fixed;inset:0;z-index:1;padding:80px 16px calc(108px + env(safe-area-inset-bottom));overflow-y:auto}
.view{display:none;max-width:1100px;margin:0 auto}.view.on{display:block}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 4px 16px}
h1.t{font-size:1.45rem;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.count{color:var(--mut);font-size:.82rem;margin-top:2px}
.search{width:100%;max-width:340px;border-radius:99px!important;padding:11px 18px!important;border:0;outline:none;background:rgba(255,255,255,.045)}
.search::placeholder{color:var(--mut)}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tile{border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .2s,background .2s}
.tile:hover{transform:translateY(-3px);background:rgba(255,255,255,.08)}
.th{display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:.92rem;color:#e9ecf0;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid var(--line)}
.tile h3{font-size:1rem;font-weight:650;letter-spacing:-.01em;line-height:1.3}
.sub{color:var(--mut);font-size:.84rem}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span,.chip{padding:3px 10px;border-radius:99px;font-size:.74rem;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#d5d9df}
.desc{color:#c3c8d0;font-size:.86rem;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid var(--line);color:var(--mut);font-size:.78rem}
.tf .go{color:#fff;font-weight:600}
.bm{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--mut);cursor:pointer;display:grid;place-items:center;z-index:2}
.bm:hover{color:#fff;background:rgba(255,255,255,.14)}
.bm.on{color:#111;background:var(--acc);border-color:transparent}
.bm svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bm.on svg{fill:currentColor}
.sk{height:200px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.08),rgba(255,255,255,.03));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:5rem 1rem;line-height:1.7}
.cline{font-size:.82rem;color:var(--mut);word-break:break-word}

.btn{border:1px solid var(--line);cursor:pointer;font-weight:600;font-size:.84rem;padding:10px 18px;border-radius:99px;text-decoration:none;display:inline-flex;gap:6px;align-items:center;justify-content:center;background:rgba(255,255,255,.07);color:var(--ink)}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.g{background:var(--acc);color:#111;border-color:transparent}.btn.g:hover{background:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.form{max-width:640px;padding:22px;display:flex;flex-direction:column;gap:12px;border-radius:22px}
.fcol{display:flex;flex-direction:column;gap:12px}
label{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);display:flex;flex-direction:column;gap:5px;font-weight:600}
input,select,textarea{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%;font-size:.9rem}
input:focus,select:focus,textarea:focus{border-color:rgba(255,255,255,.45)}textarea{min-height:84px;resize:vertical}
option{background:#1a1c20}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.75rem;color:var(--mut)}

nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px}
nav button.t{border:0;background:none;color:var(--mut);padding:8px 16px;border-radius:999px;font-size:.68rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:.2s}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;background:rgba(255,255,255,.12)}
#fab{width:48px;height:48px;border-radius:50%;border:0;margin:0 6px;background:var(--acc);color:#111;cursor:pointer;display:grid;place-items:center;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#fab svg{width:22px;height:22px;stroke:#111;stroke-width:2.2}
#fab.open{transform:rotate(135deg)}
.menu{position:fixed;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px);left:50%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;gap:8px;align-items:stretch;pointer-events:none}
.menu a{padding:13px 20px;border-radius:16px;color:var(--ink);font-weight:600;cursor:pointer;display:flex;flex-direction:column;white-space:nowrap;opacity:0;transform:translateY(24px) scale(.85);transition:.3s cubic-bezier(.3,1.3,.5,1)}
.menu.open{pointer-events:auto}.menu.open a{opacity:1;transform:none}.menu.open a:nth-child(1){transition-delay:.06s}
.menu small{display:block;font-weight:400;color:var(--mut);font-size:.72rem}
#scrim{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s}#scrim.on{opacity:1;pointer-events:auto}

.ov{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(6,7,9,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:14px;overflow-y:auto}.ov.on{display:grid}
.box{width:100%;max-width:480px;padding:26px;display:flex;flex-direction:column;gap:12px;border-radius:24px;margin:auto}
.box h2{font-size:1.35rem;font-weight:650;letter-spacing:-.02em}
.box>p{color:var(--mut)}
#role .box,#cap .box,#match .box{text-align:center}
.rc{border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;padding:18px;border-radius:18px;font-weight:650;font-size:1rem;text-align:left;transition:.2s}
.rc:hover{background:rgba(255,255,255,.1)}.rc small{display:block;font-weight:400;font-size:.8rem;color:var(--mut);margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv dt{color:var(--mut);font-size:.78rem}.kv dd{font-weight:500;font-size:.9rem}
.sec{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:-6px}
.full{font-size:.92rem;line-height:1.65;color:#cfd3d9;white-space:pre-wrap}
#detail .box{max-width:560px;text-align:left}
.dh{display:flex;gap:14px;align-items:center}
.dh .av{width:54px;height:54px;font-size:1.05rem}
.dh h2{line-height:1.25}
#mbody{display:flex;flex-direction:column;gap:6px;align-items:center}
#mbody .btns{justify-content:center;margin-top:6px}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.tt{padding:9px 18px;border-radius:99px;font-size:.82rem;animation:in .3s both}@keyframes in{from{opacity:0;transform:translateY(-8px)}}
@media(max-width:560px){.two{grid-template-columns:1fr}nav button.t{padding:8px 11px}.search{max-width:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* deeper frozen bars: header + bottom nav (solid dark + heavy blur so scrolling cards don't mix in) */
header.lg,
nav.lg{
  background:rgba(16,17,21,.88);
  -webkit-backdrop-filter:blur(24px) saturate(1.5);
  backdrop-filter:blur(24px) saturate(1.5); /* no #lens here, it distorts what's behind */
}
header.lg{
  box-shadow:
    inset 1px 1px 0 -.5px rgba(255,255,255,.5),
    inset -1px -1px 0 -.5px rgba(255,255,255,.2),
    0 10px 28px rgba(0,0,0,.6);
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="lens" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".008 .012" numOctaves="2" seed="7" result="n"/>
<feGaussianBlur in="n" stdDeviation="4" result="b"/>
<feDisplacementMap in="SourceGraphic" in2="b" scale="30" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="bg"></div>

<header class="lg"><div class="hin"><div class="logo"><b>W</b>WorkBridge</div><button class="who" id="who" onclick="askRole()">Select role</button></div></header>

<main>
 <section class="view on" id="v-explore">
  <div class="top">
   <div><h1 class="t" id="bt">Open positions</h1><div class="count" id="cnt"></div></div>
   <input class="search lg" id="q" placeholder="Search title, company, skill, city" aria-label="Search">
  </div>
  <div class="grid" id="list"></div>
 </section>

</main>

<div id="scrim" onclick="closeMenu()"></div>
<div class="menu" id="menu">
 <a class="lg" onclick="openSheet('job')">Add job vacancy<small>Publish a position</small></a>
 <a class="lg" onclick="openSheet('cand')">Add candidate<small>Add a person looking for work</small></a>
</div>
<nav class="lg">
 <button class="t on" data-v="explore"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Explore</button>
 <button id="fab" class="lg" onclick="toggleMenu()" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>

<div class="ov" id="role"><div class="box lg"><h2>Welcome to WorkBridge</h2><p>Who are you?</p>
 <button class="rc" onclick="pickRole('employer')">Employer<small>I want to hire — show me candidates</small></button>
 <button class="rc" onclick="pickRole('employee')">Employee<small>I am looking for work — show me jobs</small></button></div></div>

<div class="ov" id="detail" onclick="if(event.target.id==='detail')closeDetail()"><div class="box lg" id="dbody"></div></div>

<div class="ov" id="sheet" onclick="if(event.target.id==='sheet')closeSheet()"><div class="box lg" style="max-width:540px">
 <h2 id="sh-t"></h2>
 <div id="sh-job">
  <div class="fcol">
   <label>Job title *<input id="j-title"></label>
   <label>Description *<textarea id="j-description"></textarea></label>
   <div class="two"><label>Location *<input id="j-location"></label><label>Type<select id="j-job_type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Remote</option><option>Internship</option></select></label></div>
   <div class="two"><label>Salary<input id="j-salary"></label><label>Deadline<input id="j-deadline"></label></div>
   <label>Skills<input id="j-skills" placeholder="comma separated"></label>
   <div class="two"><label>Company<input id="j-company"></label><label>Contact name *<input id="j-name"></label></div>
   <div class="two"><label>Email *<input id="j-email" type="email"></label><label>Phone<input id="j-phone"></label></div>
   <button class="btn g" onclick="postJob()">Publish vacancy</button></div></div>
 <div id="sh-cand">
  <div class="fcol">
   <div class="two"><label>Full name *<input id="c-name"></label><label>Role *<input id="c-headline" placeholder="Electrician"></label></div>
   <div class="two"><label>Email *<input id="c-email" type="email"></label><label>Mobile<input id="c-phone"></label></div>
   <div class="two"><label>Location *<input id="c-location"></label><label>Availability<select id="c-availability"><option>Immediately</option><option>Within 2 weeks</option><option>Within 1 month</option><option>Negotiable</option></select></label></div>
   <label>Skills<input id="c-skills" placeholder="comma separated"></label>
   <label>About<textarea id="c-bio"></textarea></label>
   <label>CV / link<input id="c-link" type="url" placeholder="https://"></label>
   <button class="btn g" onclick="postCand()">Add candidate</button></div></div>
 <button class="btn" onclick="closeSheet()">Cancel</button></div></div>

<div class="ov" id="match" style="z-index:45" onclick="if(event.target.id==='match')this.classList.remove('on')"><div class="box lg"><h2>Contact details</h2><div id="mbody"></div><button class="btn g" onclick="$('#match').classList.remove('on')">Close</button></div></div>
<div class="ov" id="cap" style="z-index:55"><div class="box lg" style="max-width:380px">
 <h2>Verify you're human</h2><p>Type the code to reveal the contact</p>
 <canvas id="capc" width="220" height="64" style="align-self:center;border-radius:10px;border:1px solid var(--line)"></canvas>
 <input id="cap-in" placeholder="Enter code" autocomplete="off" style="text-align:center;letter-spacing:.3em;text-transform:uppercase">
 <div id="cap-err" style="color:var(--no);font-size:.8rem;min-height:1.1em"></div>
 <div class="btns" style="justify-content:center"><button class="btn" onclick="newCap()">New code</button><button class="btn g" onclick="capOk()">Reveal</button><button class="btn" onclick="capCancel()">Cancel</button></div></div></div>
<div id="toast"></div>

<script>
/* Backend: /jobs /roles /jobs/post /roles/post /captcha /contact/direct */
const API='https://backdata.amriksinghspain.com';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let me=LS('wb_me',null),saved=LS('wb_saved',[]);
let role=me?(me.kind==='employer'?'employer':'employee'):localStorage.getItem('wb_role');
let all={jobs:[],talent:[]},loaded=false,openRef=null;
const mode=()=>role==='employer'?'talent':'jobs';
const kind=()=>role==='employer'?'talent':'job';
const FALLBACK='https://jobs.amriksinghspain.com';

async function api(p,body){
  try{const r=await fetch(API+p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
   const d=await r.json();d._ok=r.ok;return d}catch(e){return{_ok:false,error:'Cannot reach server'}}
}
function toast(m,bad){const e=document.createElement('div');e.className='tt lg';e.style.color=bad?'var(--no)':'var(--ink)';e.textContent=m;$('#toast').append(e);setTimeout(()=>e.remove(),4000)}

addEventListener('pointermove',e=>{const el=e.target.closest?.('.lg');if(el){const r=el.getBoundingClientRect();el.style.setProperty('--mx',e.clientX-r.left+'px');el.style.setProperty('--my',e.clientY-r.top+'px')}});

/* role: employee -> jobs, employer -> candidates */
function applyRole(){
  $('#who').textContent=role==='employer'?'Employer · switch':'Employee · switch';
  $('#bt').textContent=role==='employer'?'Candidates':'Open positions';
  $('#q').placeholder=role==='employer'?'Search name, role, skill, country':'Search title, company, skill, city';
  loadExplore();
}
function askRole(){$('#role').classList.add('on')}
function pickRole(r){role=r;localStorage.setItem('wb_role',r);$('#role').classList.remove('on');applyRole()}

function go(v){closeMenu();$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));$$('nav .t').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='explore')loadExplore();$('main').scrollTop=0}
$$('nav .t').forEach(b=>b.onclick=()=>go(b.dataset.v));

/* + menu */
function toggleMenu(){const o=!$('#menu').classList.contains('open');$('#menu').classList.toggle('open',o);$('#fab').classList.toggle('open',o);$('#scrim').classList.toggle('on',o)}
function closeMenu(){$('#menu').classList.remove('open');$('#fab').classList.remove('open');$('#scrim').classList.remove('on')}
function openSheet(w){closeMenu();$('#sh-t').textContent=w==='job'?'Add job vacancy':'Add candidate';
  $('#sh-job').style.display=w==='job'?'block':'none';$('#sh-cand').style.display=w==='cand'?'block':'none';
  if(me){const m={'j-name':me.name,'j-email':me.email,'j-phone':me.phone,'j-company':me.company};Object.entries(m).forEach(([k,v])=>{if(v&&!$('#'+k).value)$('#'+k).value=v})}
  $('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}

/* data (contact fields are NOT in these lists) */
async function fetchAll(){
  const [j,r]=await Promise.all([api('/jobs'),api('/roles')]);
  all.jobs=(j.jobs||[]).map(x=>({...x,company:x.company||x.employer_name}));
  all.talent=(r.roles||[]).map(x=>({id:x.id,name:x.full_name,headline:x.role_title,location:x.country,bio:x.bio,experience:x.experience,skills:x.skills,availability:x.availability}));
  loaded=!(j.error&&r.error);
}
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const chips=s=>s?`<div class="chips">${String(s).split(',').filter(x=>x.trim()).slice(0,6).map(x=>`<span class="chip">${esc(x.trim())}</span>`).join('')}</div>`:'';
const kvh=r=>{r=r.filter(x=>x[1]);return r.length?`<dl class="kv">${r.map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl>`:''};
const isSaved=(k,id)=>saved.some(x=>x.t===k&&String(x.id)===String(id));
const find=(k,id)=>(k==='job'?all.jobs:all.talent).find(x=>String(x.id)===String(id))||(saved.find(x=>x.t===k&&String(x.id)===String(id))||{}).item;
const BM='<svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>';

/* tile */
function tile(it,k){
  const job=k==='job';
  const title=job?it.title:it.name,sub=job?it.company:(it.headline||'Open to work');
  const meta=(job?[it.location,it.job_type,it.salary]:[it.location,it.availability]).filter(Boolean);
  const desc=job?it.description:(it.bio||it.experience);
  const s=saved.find(x=>x.t===k&&String(x.id)===String(it.id));
  return`<article class="tile lg" data-open="${k}:${esc(it.id)}" tabindex="0">
   <div class="th"><div class="av">${esc(ini(job?it.company||it.title:it.name))}</div><div><h3>${esc(title)}</h3><div class="sub">${esc(sub||'')}</div></div></div>
   ${meta.length?`<div class="meta">${meta.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
   ${desc?`<div class="desc">${esc(desc)}</div>`:''}
   ${chips(it.skills)}
   <div class="tf">${s&&s.contact?`<span class="cline">${esc(s.contact.email||s.contact.phone||'')}</span>`:`<span>${job?'Apply by '+esc(it.deadline||'open'):'Available '+esc((it.availability||'on request').toLowerCase())}</span>`}<span class="go">View details</span></div>
  </article>`;
}

/* explore */
$('#q').oninput=renderExplore;
async function loadExplore(){
  if(!role)return;
  $('#list').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  await fetchAll();renderExplore();
}
function renderExplore(){
  if(!role)return;
  const q=$('#q').value.toLowerCase().trim(),jobs=mode()==='jobs',src=jobs?all.jobs:all.talent;
  const l=src.filter(x=>!q||Object.values(x).join(' ').toLowerCase().includes(q));
  $('#cnt').textContent=loaded?`${l.length} ${jobs?(l.length===1?'position':'positions'):(l.length===1?'candidate':'candidates')}`:'';
  $('#list').innerHTML=l.length?l.map(it=>tile(it,kind())).join(''):
   `<div class="empty">${!loaded?'Cannot reach the server. Check your connection and reload.':q?'No results. Try a different search.':jobs?'No positions yet. Use + to publish one.':'No candidates yet. Use + to add one.'}</div>`;
}

/* detail */
function openDetail(k,id){
  const it=find(k,id);if(!it)return;openRef={k,id};
  const job=k==='job',s=saved.find(x=>x.t===k&&String(x.id)===String(id));
  $('#dbody').innerHTML=`<div class="dh"><div class="av">${esc(ini(job?it.company||it.title:it.name))}</div><div><h2>${esc(job?it.title:it.name)}</h2><div class="sub">${esc(job?it.company:(it.headline||'Open to work'))}</div></div></div>
   ${kvh(job?[['Location',it.location],['Type',it.job_type],['Salary',it.salary],['Apply by',it.deadline]]:[['Location',it.location],['Available',it.availability]])}
   ${job?(it.description?`<div class="sec">About the role</div><div class="full">${esc(it.description)}</div>`:''):
     `${it.bio?`<div class="sec">About</div><div class="full">${esc(it.bio)}</div>`:''}${it.experience?`<div class="sec">Experience</div><div class="full">${esc(it.experience)}</div>`:''}`}
   ${it.skills?`<div class="sec">Skills</div>${chips(it.skills)}`:''}
   <div class="btns"><button class="btn g" data-reveal="${k}:${esc(id)}">${s&&s.contact?'View contact':job?'Apply · reveal contact':'Reveal contact'}</button><button class="btn" onclick="closeDetail()">Close</button></div>`;
  $('#detail').classList.add('on');
}
function closeDetail(){$('#detail').classList.remove('on');openRef=null}

document.addEventListener('click',e=>{
  const rv=e.target.closest('[data-reveal]');
  if(rv){const[k,id]=rv.dataset.reveal.split(':');askReveal(k,id);return}
  const op=e.target.closest('[data-open]');
  if(op){const[k,id]=op.dataset.open.split(':');openDetail(k,id)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches?.('.tile')){const[k,id]=e.target.dataset.open.split(':');openDetail(k,id)}
  if(e.key==='Escape'){closeMenu();closeSheet();closeDetail()}
});

/* contact reveal = SERVER captcha, then /contact/direct returns the contact */
let capCb=null,capTok='',capTarget=null,capBusy=false;
async function newCap(){
  const r=await api('/captcha');
  if(!r.svg){$('#cap-err').textContent='Captcha unavailable';return}
  capTok=r.token;
  const img=new Image();
  img.onload=()=>{const c=$('#capc').getContext('2d');c.clearRect(0,0,220,64);c.drawImage(img,0,0)};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(r.svg);
}
function openCap(cb){capCb=cb;$('#cap-in').value='';$('#cap-err').textContent='';newCap();$('#cap').classList.add('on');setTimeout(()=>$('#cap-in').focus(),60)}
async function capOk(){
  const ans=$('#cap-in').value.trim();
  if(!ans||capBusy||!capTarget)return;
  capBusy=true;
  const r=await api('/contact/direct',{target_type:capTarget.k,target_id:capTarget.id,captcha_token:capTok,captcha_answer:ans});
  capBusy=false;
  if(!r._ok||!r.contact){$('#cap-err').textContent=r.error||'Incorrect code, try again';$('#cap-in').value='';newCap();return}
  $('#cap').classList.remove('on');const f=capCb;capCb=null;f&&f(r.contact);
}
function capCancel(){$('#cap').classList.remove('on');capCb=null}
$('#cap-in').addEventListener('keydown',e=>{if(e.key==='Enter')capOk()});

function askReveal(k,id){
  const it=find(k,id);
  const s=saved.find(x=>x.t===k&&String(x.id)===String(id));
  if(s&&s.contact)return showContact(s.contact,subOf(k,it));
  const tid=it?it.id:id;capTarget={k,id:tid};openCap(c=>reveal(k,tid,c));
}
const subOf=(k,it)=>!it?'':k==='job'?it.title+(it.company?' · '+it.company:''):(it.headline||'');
function reveal(k,id,c){
  const it=find(k,id);
  if(!c||(!c.email&&!c.phone))return toast('No contact details on this listing',1);
  let e=saved.find(x=>x.t===k&&String(x.id)===String(id));
  if(!e&&it){e={t:k,id:it.id,item:it};saved.push(e)}
  if(e){e.contact=c;SV('wb_saved',saved)}
  renderExplore();
  showContact(c,subOf(k,it));
}
function contactBtns(c){const d=(c.phone||'').replace(/\D/g,'');
 return`<div class="btns">${c.email?`<a class="btn" href="mailto:${esc(c.email)}">Email</a>`:''}${d?`<a class="btn" href="tel:${esc(c.phone)}">Call</a><a class="btn" href="https://wa.me/${d}" target="_blank" rel="noopener">WhatsApp</a>`:''}${/^https?:\/\//.test(c.resume_link||'')?`<a class="btn" href="${esc(c.resume_link)}" target="_blank" rel="noopener">CV</a>`:''}</div>`}
function showContact(c,sub){$('#mbody').innerHTML=`<p style="color:#fff;font-weight:650;font-size:1.1rem">${esc(c.name)}</p><p class="sub">${esc(sub||'')}</p><p style="color:var(--ink)">${esc(c.email||'')}<br>${esc(c.phone||'')}</p>${contactBtns(c)}`;$('#match').classList.add('on')}

async function postJob(){
  const b={employer_name:$('#j-name').value.trim(),employer_email:$('#j-email').value.trim(),employer_phone:$('#j-phone').value.trim(),company:$('#j-company').value.trim(),resume_link:FALLBACK,website:''};
  ['title','description','location','job_type','salary','deadline','skills'].forEach(k=>b[k]=$('#j-'+k).value.trim());
  if(!b.title||!b.description||!b.location||!b.employer_name||!b.employer_email)return toast('Fill the required fields',1);
  const r=await api('/jobs/post',b);
  if(r._ok&&(r.success||r.id)){toast('Vacancy submitted');closeSheet();['title','description','salary','deadline','skills'].forEach(k=>$('#j-'+k).value='')}else toast(r.error||'Could not post',1);
}
async function postCand(){
  const g=k=>$('#c-'+k).value.trim();
  if(!g('name')||!g('headline')||!g('email')||!g('location'))return toast('Fill the required fields',1);
  const r=await api('/roles/post',{full_name:g('name'),email:g('email'),phone:g('phone'),country:g('location'),role_title:g('headline'),bio:g('bio'),experience:'',skills:g('skills'),availability:g('availability'),resume_link:g('link')||FALLBACK,website:''});
  if(r._ok&&(r.success||r.id)){toast('Candidate added');closeSheet();['name','headline','email','phone','location','skills','bio','link'].forEach(k=>$('#c-'+k).value='')}else toast(r.error||'Could not add',1);
}
(()=>{ if(!role)askRole();else applyRole(); fetch(API+'/visits/increment',{method:'POST'}).catch(()=>{}) })();
</script>
