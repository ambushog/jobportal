<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WorkBridge — Swipe to Work</title>
<style>
:root{--gold:#f3c969;--ink:#f6f1e4;--mut:#b9b3a3;--r:28px;--ok:#5be3a0;--no:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#07070a;overflow:hidden}
/* living colour field — gives the glass something to refract */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.85;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:55vmax;height:55vmax;background:#c8862b;left:-15vmax;top:-12vmax}
.bg i:nth-child(2){width:45vmax;height:45vmax;background:#1f8f8a;right:-12vmax;top:18vh;animation-delay:-6s}
.bg i:nth-child(3){width:50vmax;height:50vmax;background:#6a3fc2;left:20vw;bottom:-25vmax;animation-delay:-11s}
@keyframes fl{to{transform:translate(8vw,-6vh) scale(1.15)}}
/* LIQUID GLASS: lensing (SVG displacement) + thin blur + specular rim + moving highlight — not frosted glass */
.lg{position:relative;overflow:hidden;border-radius:var(--r);background:rgba(255,255,255,.05);
 -webkit-backdrop-filter:blur(3px) saturate(1.7);backdrop-filter:blur(3px) saturate(1.7);
 backdrop-filter:blur(1.5px) url(#lens) saturate(1.8) brightness(1.08);
 box-shadow:inset 1.5px 1.5px 0 -.5px rgba(255,255,255,.75),inset -1px -1px 0 -.5px rgba(255,255,255,.4),
  inset 0 0 18px rgba(255,255,255,.12),0 14px 38px rgba(0,0,0,.4)}
.lg::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
 background:radial-gradient(220px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.28),transparent 60%),
  linear-gradient(135deg,rgba(255,255,255,.18),transparent 35%,transparent 70%,rgba(255,255,255,.1))}
.lg>*{position:relative}
header{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-radius:999px}
.logo{font-weight:800;letter-spacing:-.03em;display:flex;gap:8px;align-items:center}
.logo b{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#000;display:grid;place-items:center;font-size:.75rem}
.seg{display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(0,0,0,.25)}
.seg button{border:0;background:none;color:var(--mut);font:600 .78rem inherit;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.25);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
main{position:fixed;inset:0;z-index:1;padding:78px 14px 100px;overflow-y:auto}
.view{display:none;max-width:560px;margin:0 auto;height:100%}.view.on{display:block}
/* dock */
nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:2px;padding:6px;border-radius:999px}
nav button{border:0;background:none;color:var(--mut);padding:9px 14px;border-radius:999px;font:600 .72rem inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:.25s}
nav button span{font-size:1.15rem}nav button.on{color:#fff;background:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
/* deck */
#deck{position:relative;height:calc(100% - 92px);min-height:380px;touch-action:pan-y}
.card{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;gap:10px;cursor:grab;user-select:none;will-change:transform;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card.drag{transition:none;cursor:grabbing}
.av{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font:800 1.5rem inherit;color:#111;box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
.card h2{font-size:1.45rem;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--gold);font-size:.9rem;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem;color:var(--ink)}
.meta span,.chip{padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.txt{font-size:.9rem;line-height:1.55;color:#ece6d6;overflow:hidden;flex:1;mask-image:linear-gradient(#000 75%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:.74rem}
.stamp{position:absolute;top:26px;padding:4px 14px;border:3px solid;border-radius:12px;font:900 1.5rem inherit;opacity:0;transform:rotate(-12deg);letter-spacing:.06em}
.stamp.l{left:22px;color:var(--ok)}.stamp.n{right:22px;color:var(--no);transform:rotate(12deg)}
.acts{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:16px;align-items:center}
.rb{width:64px;height:64px;border-radius:50%;border:0;color:#fff;font-size:1.6rem;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.rb:active{transform:scale(.9)}.rb.s{width:48px;height:48px;font-size:1.15rem}
.rb.y{color:var(--ok)}.rb.x{color:var(--no)}
.empty{text-align:center;color:var(--mut);padding:5rem 1rem;line-height:1.7}
/* lists / forms */
.row{padding:16px 18px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px;border-radius:24px}
.row h3{font-size:1rem}.row .sub{font-size:.82rem}
.btn{border:0;cursor:pointer;font:700 .85rem inherit;color:#fff;padding:11px 18px;border-radius:99px;text-decoration:none;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.g{background:var(--gold);color:#111}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
h1.t{font-size:1.5rem;margin:6px 4px 14px;letter-spacing:-.02em}
.form{padding:20px;display:flex;flex-direction:column;gap:12px}
label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);display:flex;flex-direction:column;gap:5px}
input,select,textarea{font:.9rem inherit;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:11px 13px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:84px;resize:vertical}
option{background:#1b1b20}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{margin-bottom:12px}
#match{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(0,0,0,.55);padding:16px}#match.on{display:grid}
#match .lg{padding:28px;width:100%;max-width:400px;text-align:center;display:flex;flex-direction:column;gap:10px}
#match h2{font-size:2rem;color:var(--gold)}
#role{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(0,0,0,.6);padding:16px}#role.on{display:grid}
#role .box{width:100%;max-width:460px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:14px}
#role h2{font-size:1.7rem;letter-spacing:-.02em}#role p{color:var(--mut);font-size:.9rem}
.rc{border:0;color:#fff;cursor:pointer;padding:20px;border-radius:24px;font:700 1.1rem inherit;display:flex;flex-direction:column;gap:4px;align-items:center}
.rc small{font:400 .78rem inherit;color:var(--mut)}.rc span{font-size:2rem}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center}
.tt{padding:10px 18px;border-radius:99px;font-size:.82rem;animation:in .3s both}@keyframes in{from{opacity:0;transform:translateY(-8px)}}
@media(max-width:480px){.two{grid-template-columns:1fr}.seg button{padding:6px 9px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="lens" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".008 .012" numOctaves="2" seed="7" result="n"/>
<feGaussianBlur in="n" stdDeviation="4" result="b"/>
<feDisplacementMap in="SourceGraphic" in2="b" scale="34" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="bg"><i></i><i></i><i></i></div>

<header class="lg">
  <div class="logo"><b>W</b>WorkBridge</div>
  <div class="seg" id="seg"><button data-m="jobs" class="on">Jobs</button><button data-m="talent">Talent</button></div>
</header>

<main>
 <section class="view on" id="v-discover">
  <div id="deck"></div>
  <div class="acts">
   <button class="rb s lg" id="bUndo" title="Undo">↶</button>
   <button class="rb x lg" id="bNo" title="Pass">✕</button>
   <button class="rb y lg" id="bYes" title="Like">♥</button>
  </div>
 </section>

 <section class="view" id="v-browse">
  <h1 class="t">Browse</h1>
  <input class="search lg" id="q" placeholder="Search title, company, skill, city…" style="border-radius:99px">
  <div id="list"></div>
 </section>

 <section class="view" id="v-matches">
  <h1 class="t">Matches</h1><div id="mlist"></div>
 </section>

 <section class="view" id="v-post">
  <h1 class="t">Post a job</h1>
  <div class="form lg">
   <label>Job title *<input id="j-title" placeholder="e.g. Senior Frontend Developer"></label>
   <label>Description<textarea id="j-description" placeholder="What will they do? Why is it great?"></textarea></label>
   <div class="two"><label>Location<input id="j-location" placeholder="Madrid"></label>
   <label>Type<select id="j-job_type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Remote</option><option>Internship</option></select></label></div>
   <div class="two"><label>Salary<input id="j-salary" placeholder="€40,000 / year"></label><label>Deadline<input id="j-deadline" placeholder="31 Dec"></label></div>
   <label>Skills (comma separated)<input id="j-skills" placeholder="JavaScript, SQL"></label>
   <button class="btn g" onclick="postJob()">Publish instantly →</button>
   
  </div>
 </section>

 <section class="view" id="v-me">
  <h1 class="t">My profile</h1>
  <div class="form lg">
   <label>I am<select id="p-kind"><option value="talent">Looking for work</option><option value="employer">Hiring</option></select></label>
   <div class="two"><label>Name *<input id="p-name"></label><label>Headline / role<input id="p-headline" placeholder="Full-stack developer"></label></div>
   <div class="two"><label>Email<input id="p-email" type="email"></label><label>Mobile<input id="p-phone" type="tel" placeholder="+34 600 000 000"></label></div>
   <div class="two"><label>Company<input id="p-company"></label><label>Location<input id="p-location" placeholder="Barcelona"></label></div>
   <label>About<textarea id="p-bio"></textarea></label>
   <label>Experience<textarea id="p-experience"></textarea></label>
   <div class="two"><label>Skills<input id="p-skills" placeholder="comma separated"></label>
   <label>Availability<select id="p-availability"><option value="">—</option><option>Immediately</option><option>Within 2 weeks</option><option>Within 1 month</option><option>Negotiable</option></select></label></div>
   <label>CV / portfolio link<input id="p-link" type="url" placeholder="https://"></label>
   <button class="btn g" onclick="saveProfile()">Save profile</button>
   <p style="font-size:.75rem;color:var(--mut);line-height:1.5">No login. Your profile is saved on this device; saving again with the same email or mobile updates it instead of creating a new one.</p>
  </div>
 </section>
</main>

<nav class="lg" id="nav">
 <button data-v="discover" class="on"><span>🔥</span>Swipe</button>
 <button data-v="browse"><span>🔎</span>Browse</button>
 <button data-v="matches"><span>💬</span>Matches</button>
 <button data-v="post"><span>➕</span>Post</button>
 <button data-v="me"><span>👤</span>Me</button>
</nav>

<div id="match"><div class="lg"><h2>Contact unlocked</h2><div id="mbody"></div><button class="btn g" onclick="$('#match').classList.remove('on')">Keep swiping</button></div></div>
<div id="role"><div class="box lg"><h2>Welcome to WorkBridge</h2><p>Who are you?</p>
 <button class="rc lg" onclick="pickRole('employer')"><span>🏢</span>EMPLOYER<small>I want to hire people</small></button>
 <button class="rc lg" onclick="pickRole('employee')"><span>🧑‍💻</span>EMPLOYEE<small>I am looking for work</small></button></div></div>
<div id="toast"></div>

<script>
/* Works with the EXISTING backend (no /v2): /jobs /roles /jobs/post /roles/post /jobs/:id/apply /contact/direct */
const API='https://backdata.amriksinghspain.com';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let me=LS('wb_me',null),sw=LS('wb_sw',{job:{},talent:{}}),hist=LS('wb_hist',[]),saved=LS('wb_saved',[]);
let mode=me&&me.kind==='employer'?'talent':'jobs',deck=[],all={jobs:[],talent:[]},busy=false;
const tt=()=>mode==='jobs'?'job':'talent';

async function api(p,body){
  try{const r=await fetch(API+p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
   const d=await r.json();d._ok=r.ok;return d}catch(e){return{_ok:false,error:'Cannot reach server'}}
}
function toast(m,bad){const e=document.createElement('div');e.className='tt lg';e.style.color=bad?'var(--no)':'var(--ink)';e.textContent=m;$('#toast').append(e);setTimeout(()=>e.remove(),4000)}
addEventListener('pointermove',e=>{const el=e.target.closest?.('.lg');if(el){const r=el.getBoundingClientRect();el.style.setProperty('--mx',e.clientX-r.left+'px');el.style.setProperty('--my',e.clientY-r.top+'px')}});

function go(v){$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='discover')loadDeck();if(v==='browse')loadList();if(v==='matches')loadMatches();if(v==='me')fillProfile()}
$$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$$('#seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function setMode(m){mode=m;$$('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));loadDeck();loadList()}

/* data (normalised) */
async function fetchAll(){
  const [j,r]=await Promise.all([api('/jobs'),api('/roles')]);
  all.jobs=(j.jobs||[]).map(x=>({...x,company:x.company||x.employer_name}));
  all.talent=(r.roles||[]).map(x=>({id:x.id,name:x.full_name,headline:x.role_title,location:x.country,bio:x.bio,experience:x.experience,skills:x.skills,availability:x.availability}));
}
const GR=['#f3c969,#e8884a','#7be0d0,#4a9be8','#c9a7ff,#e86aa8','#9be87b,#4ac2a0','#ffb199,#ff6a88'];
const grad=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%GR.length;return`linear-gradient(135deg,${GR[h]})`};
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const chips=s=>s?`<div class="chips">${s.split(',').slice(0,6).map(x=>`<span class="chip">${esc(x.trim())}</span>`).join('')}</div>`:'';
function cardHTML(it){
  if(mode==='jobs')return`<div class="av" style="background:${grad(it.company)}">${ini(it.company)}</div>
   <div><h2>${esc(it.title)}</h2><div class="sub">${esc(it.company)}</div></div>
   <div class="meta">${it.location?`<span>📍 ${esc(it.location)}</span>`:''}${it.job_type?`<span>${esc(it.job_type)}</span>`:''}${it.salary?`<span>💰 ${esc(it.salary)}</span>`:''}${it.deadline?`<span>⏳ ${esc(it.deadline)}</span>`:''}</div>
   <div class="txt">${esc(it.description)}</div>${chips(it.skills)}`;
  return`<div class="av" style="background:${grad(it.name)}">${ini(it.name)}</div>
   <div><h2>${esc(it.name)}</h2><div class="sub">${esc(it.headline||'Open to work')}</div></div>
   <div class="meta">${it.location?`<span>📍 ${esc(it.location)}</span>`:''}${it.availability?`<span>🟢 ${esc(it.availability)}</span>`:''}</div>
   <div class="txt">${esc(it.bio||it.experience)}</div>${chips(it.skills)}`;
}

/* deck */
async function loadDeck(){await fetchAll();refill(true)}
function refill(reset){const src=mode==='jobs'?all.jobs:all.talent;deck=src.filter(x=>!sw[tt()][x.id]);renderDeck()}
function renderDeck(){
  const el=$('#deck');
  if(!deck.length){el.innerHTML=`<div class="empty">🎉 You're all caught up.<br>${mode==='jobs'?'New jobs appear here once they go live.':'New talent appears here once they go live.'}</div>`;return}
  el.innerHTML=deck.slice(0,3).map((it,i)=>`<div class="card lg" style="z-index:${3-i};transform:translateY(${i*12}px) scale(${1-i*.04})">${cardHTML(it)}<span class="stamp l">LIKE</span><span class="stamp n">NOPE</span></div>`).reverse().join('');
  attach($('#deck .card:last-child'));
}
function attach(c){
  let x0=0,dx=0,on=false;
  c.onpointerdown=e=>{on=true;x0=e.clientX;c.classList.add('drag');c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!on)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
   c.querySelector('.stamp.l').style.opacity=Math.max(0,dx/110);c.querySelector('.stamp.n').style.opacity=Math.max(0,-dx/110)};
  c.onpointerup=()=>{if(!on)return;on=false;c.classList.remove('drag');
   if(Math.abs(dx)>110)fling(dx>0?'like':'pass',c);else{c.style.transform='';c.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}dx=0};
}
async function decide(it,dec){
  sw[tt()][it.id]=dec;hist.push({t:tt(),id:it.id});SV('wb_sw',sw);SV('wb_hist',hist.slice(-50));
  if(dec==='like')await onLike(it);
}
async function fling(dec,c){
  if(busy||!deck.length)return;busy=true;c=c||$('#deck .card:last-child');const it=deck[0];
  c.classList.remove('drag');c.style.transform=`translateX(${dec==='like'?'':'-'}130vw) rotate(${dec==='like'?30:-30}deg)`;
  setTimeout(()=>{deck.shift();busy=false;renderDeck()},260);
  await decide(it,dec);
}
$('#bYes').onclick=()=>fling('like');$('#bNo').onclick=()=>fling('pass');
$('#bUndo').onclick=()=>{const h=hist.pop();if(!h)return toast('Nothing to undo',1);delete sw[h.t][h.id];SV('wb_sw',sw);SV('wb_hist',hist);toast('Rewound');refill()};
addEventListener('keydown',e=>{if(!$('#v-discover').classList.contains('on'))return;if(e.key==='ArrowRight')fling('like');if(e.key==='ArrowLeft')fling('pass')});

/* what a right-swipe does */
function remember(e){if(!saved.find(x=>x.t===e.t&&x.id===e.id)){saved.push(e);SV('wb_saved',saved)}}
async function onLike(it){
  if(mode==='jobs'){                       // employee likes a job -> real application with saved profile
    remember({t:'job',id:it.id,title:it.title,company:it.company,status:'saved'});
    if(!me||!me.email||!me.link){toast('Saved. Add email + CV link in Me to apply instantly',1);return}
    const r=await api(`/jobs/${it.id}/apply`,{applicant_name:me.name,applicant_email:me.email,applicant_phone:me.phone||'',skills:me.skills||'',experience:me.experience||'',cover_letter:me.bio||'',resume_link:me.link,website:'',location:me.location||''});
    if(r._ok&&r.success!==false){saved.find(x=>x.t==='job'&&x.id===it.id).status='applied';SV('wb_saved',saved);toast('Applied ♥')}
    else toast(r.error||'Could not apply',1);
  }else{                                   // employer likes a talent -> unlock contact
    const r=await api('/contact/direct',{target_id:it.id,target_type:'talent'});
    if(r._ok&&r.success){const c=r.contact;remember({t:'talent',id:it.id,title:it.name,company:it.headline,contact:c});showContact(c,it.headline)}
    else{remember({t:'talent',id:it.id,title:it.name,company:it.headline});toast(r.error||'Contact unavailable',1)}
  }
}

/* contact */
function contactBtns(c){const d=(c.phone||'').replace(/\D/g,'');
 return`<div class="btns">${c.email?`<a class="btn lg" href="mailto:${esc(c.email)}">✉ Email</a>`:''}${d?`<a class="btn lg" href="tel:${esc(c.phone)}">📞 Call</a><a class="btn lg" style="color:#7dffb0" href="https://wa.me/${d}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}${/^https?:\/\//.test(c.resume_link||'')?`<a class="btn lg" href="${esc(c.resume_link)}" target="_blank" rel="noopener">📎 CV</a>`:''}</div>`}
function showContact(c,sub){$('#mbody').innerHTML=`<p style="color:#fff;font-weight:700">${esc(c.name)}</p><p style="color:var(--mut)">${esc(sub||c.role||'')}</p><p>${esc(c.email||'')}<br>${esc(c.phone||'')}</p>${contactBtns(c)}`;$('#match').classList.add('on')}
async function employerContact(id){
  const r=await api('/contact/direct',{target_id:id,target_type:'employer'});
  if(r._ok&&r.success)showContact(r.contact,'Employer');else toast(r.error||'Contact unavailable',1)
}
function loadMatches(){
  $('#mlist').innerHTML=saved.length?saved.slice().reverse().map(e=>`<div class="row lg"><h3>${esc(e.title)}</h3><div class="sub">${esc(e.company||'')}${e.status?' · '+e.status:''}</div>
   ${e.contact?`<div style="font-size:.82rem;color:var(--mut)">${esc(e.contact.email||'')} ${esc(e.contact.phone||'')}</div>${contactBtns(e.contact)}`:(e.t==='job'?`<div class="btns"><button class="btn lg" onclick="employerContact(${e.id})">🏢 Employer contact</button></div>`:'')}</div>`).join('')
   :`<div class="empty">Nothing yet.<br>Swipe right on jobs to apply, or on talent to unlock contact details.</div>`;
}

/* browse */
$('#q').oninput=loadList;
async function loadList(){
  if(!all.jobs.length&&!all.talent.length)await fetchAll();
  const q=$('#q').value.toLowerCase(),src=mode==='jobs'?all.jobs:all.talent;
  const l=src.filter(x=>!q||Object.values(x).join(' ').toLowerCase().includes(q));
  $('#list').innerHTML=l.length?l.map(it=>`<div class="row lg"><h3>${esc(mode==='jobs'?it.title:it.name)}</h3><div class="sub">${esc(mode==='jobs'?it.company:it.headline)}</div><div class="meta">${it.location?`<span>📍 ${esc(it.location)}</span>`:''}${it.job_type?`<span>${esc(it.job_type)}</span>`:''}${it.salary?`<span>💰 ${esc(it.salary)}</span>`:''}${it.availability?`<span>🟢 ${esc(it.availability)}</span>`:''}</div>${chips(it.skills)}<div class="btns"><button class="btn lg" onclick="quick(${it.id})">♥ Like</button></div></div>`).join(''):`<div class="empty">Nothing found.</div>`;
}
async function quick(id){const it=(mode==='jobs'?all.jobs:all.talent).find(x=>x.id===id);if(it){sw[tt()][id]='like';SV('wb_sw',sw);await onLike(it)}}

/* profile — one per browser; same email/phone just updates it */
const PF=['kind','name','headline','email','phone','company','location','bio','experience','skills','availability','link'];
function fillProfile(){if(me)PF.forEach(k=>{const e=$('#p-'+k);if(e)e.value=me[k]||''})}
async function saveProfile(){
  const b={};PF.forEach(k=>b[k]=$('#p-'+k).value.trim());
  if(!b.name||(!b.email&&!b.phone))return toast('Name and email or mobile required',1);
  me={...(me||{}),...b};SV('wb_me',me);
  if(me.kind==='talent'){                  // publish to Browse Talent
    const r=await api('/roles/post',{full_name:me.name,email:me.email,phone:me.phone,country:me.location,role_title:me.headline||'Open to work',bio:me.bio,experience:me.experience,skills:me.skills,availability:me.availability,resume_link:me.link,website:''});
    toast(r._ok?'Profile saved & published':(r.error||'Saved locally; publish failed'),!r._ok);
  }else toast('Profile saved');
  setMode(me.kind==='employer'?'talent':'jobs');go('discover');
}
async function postJob(){
  if(!me||!me.email){toast('Add your name + email in Me first',1);return go('me')}
  const b={employer_name:me.name,employer_email:me.email,employer_phone:me.phone||'',company:me.company||'',resume_link:me.link||'https://workbridge',website:''};
  ['title','description','location','job_type','salary','deadline','skills'].forEach(k=>b[k]=$('#j-'+k).value.trim());
  const r=await api('/jobs/post',b);
  if(r._ok&&(r.success||r.id)){toast('Job submitted');['title','description','salary','deadline','skills'].forEach(k=>$('#j-'+k).value='')}
  else toast(r.error||'Could not post',1);
}

function pickRole(r){
  localStorage.setItem('wb_role',r);$('#role').classList.remove('on');
  $('#p-kind').value=r==='employer'?'employer':'talent';
  setMode(r==='employer'?'talent':'jobs');go('me');
  toast(r==='employer'?'Set up your company profile':'Set up your profile');
}
(()=>{
  if(!me&&!localStorage.getItem('wb_role'))$('#role').classList.add('on');
  if(!me&&localStorage.getItem('wb_role')==='employer')mode='talent';
  setMode(mode);fetch(API+'/visits/increment',{method:'POST'}).catch(()=>{});
})();
</script>
